name: Build iOS app

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'codex/kmp-compose-migration'
        type: string
      configuration:
        description: 'Xcode build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      device_build:
        description: 'Also build an unsigned device (arm64) .app'
        required: false
        default: false
        type: boolean
      maplibre_version:
        description: 'MapLibre Compose version (use 0.15.1-SNAPSHOT to follow the mutable snapshot)'
        required: false
        default: '0.15.1-20260907.101928-13'
        type: string
  push:
    branches:
      - 'codex/kmp-compose-migration'

permissions:
  contents: read

concurrency:
  group: build-ios-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
  MAPLIBRE_COMPOSE_VERSION: ${{ inputs.maplibre_version || '0.15.1-20260907.101928-13' }}
  XCODE_PROJECT: iosApp/iosApp.xcodeproj
  DERIVED_DATA_SIM: build/xcode-ci-simulator
  DERIVED_DATA_DEVICE: build/xcode-ci-device

jobs:
  build:
    # Kotlin/Native only targets iosArm64 + iosSimulatorArm64 here, so an Apple Silicon runner is required
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # mise.toml pins Java 25; the desktop target compiles with jvmTarget 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The branch follows the *mutable* org.maplibre.compose 0.15.1-SNAPSHOT, whose API changes
      # daily, so an unpinned CI build breaks whenever upstream publishes. Pin the timestamped
      # publication the sources are written against (see docs/multiplatform/03-maplibre-compose-upstream.md).
      # This goes in GRADLE_USER_HOME rather than on the command line because the Xcode build phase
      # invokes a bare `./gradlew`, which would otherwise resolve a different snapshot.
      - name: Pin MapLibre Compose snapshot
        run: |
          set -euo pipefail
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home/init.d"
          if [ -z "$MAPLIBRE_COMPOSE_VERSION" ] || [ "${MAPLIBRE_COMPOSE_VERSION%-SNAPSHOT}" != "$MAPLIBRE_COMPOSE_VERSION" ]; then
            echo "Following the mutable snapshot; upstream may have moved past what this branch compiles against."
            exit 0
          fi
          echo "mapLibreComposeVersion=$MAPLIBRE_COMPOSE_VERSION" >> "$gradle_home/gradle.properties"
          # Pinning the declared version is not enough: maplibre-compose's Gradle module metadata
          # redirects its platform variants (…-iossimulatorarm64 etc.) to a plain 0.15.1-SNAPSHOT,
          # which would resolve to the newest daily build again. Force the whole group instead.
          cat > "$gradle_home/init.d/pin-maplibre-compose.gradle" <<GROOVY
          def pinned = "$MAPLIBRE_COMPOSE_VERSION"
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.maplibre.compose"
                          && details.requested.version?.endsWith("-SNAPSHOT")) {
                          details.useVersion(pinned)
                      }
                  }
              }
          }
          GROOVY
          echo "Pinned org.maplibre.compose to $MAPLIBRE_COMPOSE_VERSION"

      # ~/.konan holds the Kotlin/Native toolchain and prebuilt platform libs (~2 GB)
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Show toolchain versions
        run: |
          java -version
          xcodebuild -version
          ./gradlew --version

      - name: Set env
        run: echo "COMMIT_SHA=$(git log -n 1 --format='%h')" >> "$GITHUB_ENV"

      # The repo does not commit iosApp.xcodeproj/xcshareddata, so xcodebuild has no scheme to
      # build. Generate one from the target in project.pbxproj if the branch does not ship it.
      - name: Ensure a shared Xcode scheme exists
        run: |
          set -euo pipefail
          scheme_dir="$XCODE_PROJECT/xcshareddata/xcschemes"
          if [ -f "$scheme_dir/iosApp.xcscheme" ]; then
            echo "Shared scheme already present, leaving it alone."
            exit 0
          fi
          target_id=$(awk '/Begin PBXNativeTarget section/,/End PBXNativeTarget section/' "$XCODE_PROJECT/project.pbxproj" \
            | grep -m1 -E '^[[:space:]]+[A-F0-9]{24} /\* iosApp \*/' \
            | awk '{print $1}' || true)
          if [ -z "$target_id" ]; then
            echo "::error::Could not find the 'iosApp' native target in $XCODE_PROJECT/project.pbxproj"
            exit 1
          fi
          echo "Generating shared scheme for target $target_id"
          mkdir -p "$scheme_dir"
          cat > "$scheme_dir/iosApp.xcscheme" <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1620" version="1.7">
             <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                      <BuildableReference
                         BuildableIdentifier="primary"
                         BlueprintIdentifier="$target_id"
                         BuildableName="StreetComplete.app"
                         BlueprintName="iosApp"
                         ReferencedContainer="container:iosApp.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES">
                <Testables>
                </Testables>
             </TestAction>
             <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference
                      BuildableIdentifier="primary"
                      BlueprintIdentifier="$target_id"
                      BuildableName="StreetComplete.app"
                      BlueprintName="iosApp"
                      ReferencedContainer="container:iosApp.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference
                      BuildableIdentifier="primary"
                      BlueprintIdentifier="$target_id"
                      BuildableName="StreetComplete.app"
                      BlueprintName="iosApp"
                      ReferencedContainer="container:iosApp.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction buildConfiguration="Debug">
             </AnalyzeAction>
             <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES">
             </ArchiveAction>
          </Scheme>
          XML

      # Not strictly needed (the Xcode build phase runs embedAndSignAppleFrameworkForXcode, which
      # depends on this task) but it separates "Kotlin did not compile" from "Xcode failed" in the log
      - name: Compile Kotlin framework for the simulator
        run: ./gradlew ":app:link${CONFIGURATION}FrameworkIosSimulatorArm64"

      - name: Build app for iOS Simulator
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme iosApp \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA_SIM" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package simulator app
        run: |
          set -euo pipefail
          products="$DERIVED_DATA_SIM/Build/Products/$CONFIGURATION-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent \
            "$products/StreetComplete.app" \
            "StreetComplete-ios-simulator-$CONFIGURATION-$COMMIT_SHA.zip"

      - name: Archive simulator app
        uses: actions/upload-artifact@v4
        with:
          name: StreetComplete-ios-simulator-${{ env.CONFIGURATION }}-${{ env.COMMIT_SHA }}
          path: StreetComplete-ios-simulator-*.zip
          retention-days: 30

      # Signing certificates are not available in CI, so the device build is left unsigned:
      # it verifies the iosArm64 target compiles and links, but cannot be installed as-is.
      - name: Build unsigned app for iOS device
        if: ${{ inputs.device_build }}
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme iosApp \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_DEVICE" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package unsigned device app
        if: ${{ inputs.device_build }}
        run: |
          set -euo pipefail
          products="$DERIVED_DATA_DEVICE/Build/Products/$CONFIGURATION-iphoneos"
          ditto -c -k --sequesterRsrc --keepParent \
            "$products/StreetComplete.app" \
            "StreetComplete-ios-device-unsigned-$CONFIGURATION-$COMMIT_SHA.zip"

      - name: Archive unsigned device app
        if: ${{ inputs.device_build }}
        uses: actions/upload-artifact@v4
        with:
          name: StreetComplete-ios-device-unsigned-${{ env.CONFIGURATION }}-${{ env.COMMIT_SHA }}
          path: StreetComplete-ios-device-unsigned-*.zip
          retention-days: 30
