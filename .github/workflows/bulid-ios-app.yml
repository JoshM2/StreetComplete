name: Build iOS ipa

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'codex/kmp-compose-migration'
        type: string
      configuration:
        description: 'Xcode build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      maplibre_commit:
        description: "maplibre-compose commit to build and publish locally, or 'none' to use a published artifact"
        required: false
        default: '7fddf793185833a70f89bc5d3c38babbe65490e5'
        type: string
      maplibre_version:
        description: "Published MapLibre Compose version, used only when maplibre_commit is 'none'"
        required: false
        default: '0.15.1-20260907.101928-13'
        type: string
  push:
    branches:
      - 'codex/kmp-compose-migration'

permissions:
  contents: read

concurrency:
  group: build-ios-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
  MAPLIBRE_COMMIT: ${{ inputs.maplibre_commit || '7fddf793185833a70f89bc5d3c38babbe65490e5' }}
  MAPLIBRE_COMPOSE_VERSION: ${{ inputs.maplibre_version || '0.15.1-20260907.101928-13' }}
  MAPLIBRE_SRC_DIR: maplibre-compose-src
  XCODE_PROJECT: iosApp/iosApp.xcodeproj
  DERIVED_DATA: build/xcode-ci

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # mise.toml pins Java 25; the desktop target compiles with jvmTarget 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ~/.konan holds the Kotlin/Native toolchain and prebuilt platform libs (~2 GB)
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # This branch tracks the *mutable* org.maplibre.compose 0.15.1-SNAPSHOT, and its sources only
      # compile against upstream commits b1652c3..6fded72 (2026-09-07): rememberVectorTileSource
      # landed in b1652c3 and initialBaseStyle was removed in 0d51043 under three hours later.
      # Upstream's daily publisher stepped over that window, so *no* published snapshot compiles this
      # branch and the artifacts have to be built from a commit inside it. 7fddf79 is the one the
      # branch was validated against — docs/multiplatform/03-maplibre-compose-upstream.md calls it
      # 9cd93ad, its pre-merge SHA. Set maplibre_commit to 'none' to try a published snapshot again,
      # which is what you want once this branch is rebased onto current upstream.
      - name: Check out MapLibre Compose
        if: env.MAPLIBRE_COMMIT != 'none'
        uses: actions/checkout@v4
        with:
          repository: maplibre/maplibre-compose
          ref: ${{ env.MAPLIBRE_COMMIT }}
          path: ${{ env.MAPLIBRE_SRC_DIR }}

      # Only the two modules and the one Apple target StreetComplete resolves, which skips their
      # simulator, Android, JVM, JS and desktop-runtime publications. Their gradle.properties turns
      # signAllPublications on, which would demand a GPG key we do not have.
      - name: Publish MapLibre Compose to the local Maven repository
        if: env.MAPLIBRE_COMMIT != 'none'
        working-directory: ${{ env.MAPLIBRE_SRC_DIR }}
        run: |
          set -euo pipefail
          version="0.15.1-ci-$(git rev-parse --short HEAD)"
          tasks=""
          for module in :lib:maplibre-compose :lib:location; do
            tasks="$tasks $module:publishKotlinMultiplatformPublicationToMavenLocal"
            tasks="$tasks $module:publishIosArm64PublicationToMavenLocal"
          done
          # shellcheck disable=SC2086
          ./gradlew -PmaplibreVersion="$version" -PsignAllPublications=false $tasks
          echo "RESOLVED_MAPLIBRE_VERSION=$version" >> "$GITHUB_ENV"

      # Written to GRADLE_USER_HOME rather than passed on the command line because the Xcode build
      # phase invokes a bare `./gradlew`, which would otherwise resolve something else entirely.
      - name: Point StreetComplete at the pinned MapLibre Compose
        run: |
          set -euo pipefail
          version="${RESOLVED_MAPLIBRE_VERSION:-$MAPLIBRE_COMPOSE_VERSION}"
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home/init.d"
          if [ -z "$version" ] || [ "${version%-SNAPSHOT}" != "$version" ]; then
            echo "Following the mutable snapshot; upstream has moved past what this branch compiles against."
            exit 0
          fi
          echo "mapLibreComposeVersion=$version" >> "$gradle_home/gradle.properties"
          # Setting the version alone is not enough: maplibre-compose's module metadata redirects its
          # platform variants (…-iosarm64 and friends) to a plain 0.15.1-SNAPSHOT, which would
          # resolve back to the newest daily build. So force the whole group, and add mavenLocal for
          # the locally published build. mavenLocal goes to a project only where that project already
          # declares repositories, so PREFER_PROJECT resolution stays intact for the projects that
          # rely on the settings-level repositories.
          cat > "$gradle_home/init.d/pin-maplibre-compose.gradle" <<GROOVY
          def pinned = "$version"
          beforeSettings { settings ->
              settings.dependencyResolutionManagement.repositories {
                  mavenLocal { content { includeGroup("org.maplibre.compose") } }
              }
          }
          allprojects { project ->
              project.afterEvaluate {
                  if (!project.repositories.isEmpty()) {
                      project.repositories.mavenLocal { content { includeGroup("org.maplibre.compose") } }
                  }
              }
              project.configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.maplibre.compose"
                          && details.requested.version?.endsWith("-SNAPSHOT")) {
                          details.useVersion(pinned)
                      }
                  }
              }
          }
          GROOVY
          echo "Pinned org.maplibre.compose to $version"

      - name: Show toolchain versions
        run: |
          java -version
          xcodebuild -version
          ./gradlew --version

      - name: Set env
        run: echo "COMMIT_SHA=$(git log -n 1 --format='%h')" >> "$GITHUB_ENV"

      # The repo does not commit iosApp.xcodeproj/xcshareddata, so xcodebuild has no scheme to
      # build. Generate one from the target in project.pbxproj if the branch does not ship it.
      - name: Ensure a shared Xcode scheme exists
        run: |
          set -euo pipefail
          scheme_dir="$XCODE_PROJECT/xcshareddata/xcschemes"
          if [ -f "$scheme_dir/iosApp.xcscheme" ]; then
            echo "Shared scheme already present, leaving it alone."
            exit 0
          fi
          target_id=$(awk '/Begin PBXNativeTarget section/,/End PBXNativeTarget section/' "$XCODE_PROJECT/project.pbxproj" \
            | grep -m1 -E '^[[:space:]]+[A-F0-9]{24} /\* iosApp \*/' \
            | awk '{print $1}' || true)
          if [ -z "$target_id" ]; then
            echo "::error::Could not find the 'iosApp' native target in $XCODE_PROJECT/project.pbxproj"
            exit 1
          fi
          echo "Generating shared scheme for target $target_id"
          mkdir -p "$scheme_dir"
          cat > "$scheme_dir/iosApp.xcscheme" <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1620" version="1.7">
             <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                      <BuildableReference
                         BuildableIdentifier="primary"
                         BlueprintIdentifier="$target_id"
                         BuildableName="StreetComplete.app"
                         BlueprintName="iosApp"
                         ReferencedContainer="container:iosApp.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES">
                <Testables>
                </Testables>
             </TestAction>
             <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference
                      BuildableIdentifier="primary"
                      BlueprintIdentifier="$target_id"
                      BuildableName="StreetComplete.app"
                      BlueprintName="iosApp"
                      ReferencedContainer="container:iosApp.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference
                      BuildableIdentifier="primary"
                      BlueprintIdentifier="$target_id"
                      BuildableName="StreetComplete.app"
                      BlueprintName="iosApp"
                      ReferencedContainer="container:iosApp.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction buildConfiguration="Debug">
             </AnalyzeAction>
             <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES">
             </ArchiveAction>
          </Scheme>
          XML

      # Not strictly needed (the Xcode build phase runs embedAndSignAppleFrameworkForXcode, which
      # depends on this task) but it separates "Kotlin did not compile" from "Xcode failed" in the log
      - name: Compile Kotlin framework for the device
        run: ./gradlew ":app:link${CONFIGURATION}FrameworkIosArm64"

      # Built unsigned on purpose. Sideloading tools (Sideloadly, AltStore) re-sign with your own
      # Apple ID and rewrite the bundle ID, so a signature from CI would only be thrown away — and
      # CI has no signing certificate for the TEAM_ID in iosApp/Configuration/Config.xcconfig anyway.
      - name: Build unsigned app for iOS device
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme iosApp \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      # An ipa is just a zip with the .app inside a top-level Payload/ directory.
      - name: Package ipa
        run: |
          set -euo pipefail
          products="$DERIVED_DATA/Build/Products/$CONFIGURATION-iphoneos"
          staging="$RUNNER_TEMP/ipa"
          rm -rf "$staging"
          mkdir -p "$staging/Payload"
          cp -R "$products/StreetComplete.app" "$staging/Payload/"
          ditto -c -k --keepParent "$staging/Payload" \
            "StreetComplete-$CONFIGURATION-$COMMIT_SHA.ipa"
          unzip -l "StreetComplete-$CONFIGURATION-$COMMIT_SHA.ipa" | head -5

      - name: Archive ipa
        uses: actions/upload-artifact@v4
        with:
          name: StreetComplete-ipa-${{ env.CONFIGURATION }}-${{ env.COMMIT_SHA }}
          path: '*.ipa'
          retention-days: 30
